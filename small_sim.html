<!DOCTYPE html>
<html lang="en">
</head>
<body>
    <canvas id="solarSystemCanvas" width="1200" height="1200"></canvas>
    <div id="animationContainer"></div>
    <div class="center-container">
        <div id="CONTAINER_PART6">
            <!-- Position ABSOLUTE provides canvases to be able to be layered on top of each other -->
            <!-- BACKGROUND LAYER - ABSOLUTE -->
            <canvas id="LAYER_BACKGROUND_T6" width="600" height="600" style="position: absolute; left: 0; top: 0; z-index: 0;">
                Your browser does not support HTML Canvas. Please update your browser.
            </canvas>
            <!-- FOREGROUND LAYER - ABSOLUTE -->
            <a href="http://www.planetaryorbits.com/T6_createLayeredCanvas.js" style="text-decoration:none;">
                <canvas id="LAYER_FOREGROUND_T6" width="600" height="600" style="position: absolute; left: 0; top: 0; z-index: 1;">
                </canvas>
            </a>
            <div style="display:block;width:600px;height:35px;position:relative;top:100%;left:0%;border-top:2px solid lightgrey;">
            </div>
        </div>
    </div>
    <footer>
        <p>&Source: http://www.planetaryorbits.com/index.html</p>
    </footer>
    <script type="text/javascript" src="OrrerySolarSystem.js"></script>
    <script type="text/javascript" src="T6_createLayeredCanvas.js"></script>
</body>
</html>
